name: SlyOS
options:
  bundleIdPrefix: com.belto
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Swift 5 language mode on purpose: strict concurrency would flag the shared token store and
    # the observable state before either is worth designing around. Revisit once the brain lands.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SlyOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/SlyOSCompanion
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belto.slyos.ios
        PRODUCT_NAME: SlyOS
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: SlyOS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Without a launch screen iOS runs the app letterboxed in a compatibility window — black
        # bands top and bottom, and nothing reaches the edges. This is what makes it full-bleed.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # SlyOS draws its own status line (time left, battery right), exactly as the Android
        # launcher does. Leaving the system bar visible showed the time twice.
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
        # Portrait only, matching the Android shell.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Permission strings are written now because the App Store rejects a build whose usage
        # description does not say what the data is actually for.
        INFOPLIST_KEY_NSCameraUsageDescription: SlyOS uses the camera when you open Look mode to identify, read, and remember what you point at.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: SlyOS uses the microphone only when you choose voice input or a voice workflow.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: SlyOS transcribes speech only after you tap the voice control.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: SlyOS reads photos you explicitly choose for Look, document, receipt, and memory workflows.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: SlyOS reads your calendar only when you ask about your schedule and writes events only after a confirmed request.
        INFOPLIST_KEY_NSContactsUsageDescription: SlyOS searches your contacts only when a prompt needs a person, phone number, or email address.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: SlyOS reads and writes reminders only for reminder workflows you explicitly request.
        # Location is used to answer "where am I", to share your location in a message you send, and
        # to give answers local context. Only when-in-use — SlyOS has no reason to track you in the
        # background, and asking for Always would be both a rejection risk and a lie.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: SlyOS uses your location when you ask something about where you are, or ask it to share your location.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: SlyOS saves a document or image to your photos only when you ask it to.
        INFOPLIST_KEY_NSFaceIDUsageDescription: SlyOS can lock your brain behind Face ID so only you can read it.
        INFOPLIST_KEY_NSMotionUsageDescription: SlyOS uses motion only to tell whether you are travelling when that changes an answer.
        # Set this to the iOS OAuth client id from Google Cloud Console. It must be an *iOS*
        # client — Google ties the redirect scheme to the client type, so the Android one is
        # rejected. Empty means Google sign-in is disabled and the UI says so rather than failing.
        INFOPLIST_KEY_GoogleOAuthClientID: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: SlyOS.entitlements
    dependencies:
      - target: ShareExtension

  # Reply drafting. iOS forbids reading other apps' notifications, so the honest equivalent is
  # selecting a message anywhere and sharing it here. Runs in its own process, which is why the
  # brain lives in an App Group container both targets can reach.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      # Only what the extension actually needs. Permissions, Importers, LookMode and the panels are
      # deliberately excluded: they reach UIApplication.shared and heavy frameworks an extension
      # neither may use nor needs.
      - path: Sources/SlyOSCompanion/SlyTheme.swift
      - path: Sources/SlyOSCompanion/SlyStore.swift
      - path: Sources/SlyOSCompanion/SharedContainer.swift
      - path: Sources/SlyOSCompanion/Keychain.swift
      - path: Sources/SlyOSCompanion/ModelRouter.swift
      - path: Sources/SlyOSCompanion/AgentClient.swift
      - path: Sources/SlyOSCompanion/SlySettings.swift
      - path: Sources/SlyOSCompanion/SlyProfile.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belto.slyos.ios.share
        # Distinct from the app's: two targets producing a module called SlyOS collide on the
        # .swiftmodule outputs. The display name below is what the user actually sees.
        PRODUCT_NAME: SlyOSShare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SlyOS
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
    info:
      path: ShareExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
